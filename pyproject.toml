[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nameforge"
version = "0.1.0"
description = "Generate random names from word lists and templates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "oakes-labs5" },
]

[tool.setuptools.packages.find]
include = ["nameforge*"]
